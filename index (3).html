<html lang="es">

<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg)}
.hdr{background:linear-gradient(135deg,#C8623A,#E07848 60%,#C8940A);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 3px 14px rgba(200,98,58,.3)}
.hdr-l{display:flex;align-items:center;gap:9px}
.hdr-t{font-size:19px;font-weight:900;color:#fff}
.hdr-n{font-size:12px;color:rgba(255,255,255,.8);font-weight:700}
.hdr-btn{background:rgba(255,255,255,.25);border:none;border-radius:10px;padding:7px 13px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:none}
.page{padding:20px 15px 64px;animation:fu .26s ease}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--r);padding:18px 15px;box-shadow:var(--shd);margin-bottom:13px}
.card-cr{background:var(--cream);border:2px solid var(--bdr)}
.card-gd{background:var(--gld-lt);border:2px solid var(--gld)}
.btn{width:100%;padding:15px 16px;border:none;border-radius:13px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;margin-bottom:9px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:default;transform:none}
.bp{background:linear-gradient(135deg,var(--pri),#E07848);color:#fff;box-shadow:0 5px 14px rgba(200,98,58,.32)}
.bs{background:transparent;color:var(--pri);border:2.5px solid var(--pri)}
.bg{background:var(--cream);color:var(--txt-md);border:2px solid var(--bdr)}
.prog-wrap{margin-bottom:14px}
.prog-lbl{font-size:13px;color:var(--txt-lt);text-align:center;margin-bottom:5px;font-weight:700}
.prog-bar{height:10px;background:#EDD5C0;border-radius:5px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--gld));border-radius:5px;transition:width .4s ease}
.badge{display:inline-block;padding:4px 12px;border-radius:18px;font-size:13px;font-weight:800;color:#fff;background:var(--pri)}
.bdg-g{background:var(--grn)}.bdg-d{background:var(--txt-md)}.bdg-gd{background:var(--gld)}
.back{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;background:transparent;border:2px solid var(--bdr);border-radius:10px;font-size:14px;font-weight:700;color:var(--txt-md);cursor:pointer;font-family:inherit;margin-bottom:15px}
.ghdr{text-align:center;margin-bottom:13px}
.ghdr-ico{font-size:36px}.ghdr-ttl{font-size:24px;font-weight:900;color:var(--txt);margin:3px 0}.ghdr-sub{font-size:13px;color:var(--txt-lt);font-weight:600}
.brow{display:flex;justify-content:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.ginput{width:100%;padding:14px;font-size:24px;font-weight:700;text-align:center;border:3px solid var(--bdr);border-radius:12px;font-family:inherit;outline:none;background:#fff;transition:border-color .2s;-moz-appearance:textfield}
.ginput:focus{border-color:var(--pri)}.ginput.ok{border-color:var(--ok);background:var(--ok-bg)}.ginput.err{border-color:var(--err);background:var(--err-bg)}
.ginput::-webkit-inner-spin-button,.ginput::-webkit-outer-spin-button{-webkit-appearance:none}
.fb{font-size:20px;font-weight:800;text-align:center;margin:12px 0}.fb-ok{color:var(--ok)}.fb-err{color:var(--err)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}
.cbtn{padding:14px 8px;background:var(--cream);border:2.5px solid var(--bdr);border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--txt);transition:all .15s;line-height:1.3}
.cbtn:active:not([disabled]){transform:scale(.96)}
.cbtn.sel{background:var(--pri);color:#fff;border-color:var(--pri)}
.cbtn.c-ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
.cbtn.c-err{background:var(--err)!important;color:#fff!important;border-color:var(--err)!important}
.cbtn[disabled]{cursor:default}
.pcard{aspect-ratio:1;border:3px solid #C09010;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;background:var(--gld)}
.pcard.flip{background:#fff;border-color:var(--pri)}.pcard.done{background:var(--ok-bg);border-color:var(--ok);cursor:default}
.sqgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:9px}
.sqbtn{height:104px;border-radius:16px;border:none;cursor:pointer;font-family:inherit;font-size:18px;font-weight:800;color:rgba(255,255,255,.9);transition:all .15s}
.sqbtn:disabled{cursor:default}.sqbtn.lit{transform:scale(1.07);filter:brightness(1.45);box-shadow:0 0 0 5px rgba(255,255,255,.45)}
.gcrd{width:100%;background:#fff;border:none;border-radius:15px;padding:14px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:var(--shd);margin-bottom:10px;font-family:inherit;text-align:left;transition:transform .15s}
.gcrd:active{transform:scale(.985)}
.gcrd-ico{font-size:34px;flex-shrink:0}.gcrd-ttl{font-size:17px;font-weight:800;color:var(--txt)}.gcrd-dsc{font-size:12px;color:var(--txt-md);margin-top:2px}.gcrd-lvl{font-size:12px;font-weight:800;margin-top:3px}.gcrd-arr{font-size:21px;color:var(--txt-lt);margin-left:auto;flex-shrink:0}
.stars{letter-spacing:2px;font-size:14px}
.hr-ring{position:relative;width:110px;height:110px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.hr-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:4px solid var(--pri-lt);opacity:.4;animation:spin 6s linear infinite}
.hr-ring::after{content:'';position:absolute;inset:12px;border-radius:50%;border:3px dashed var(--gld);opacity:.5;animation:spin 9s linear infinite reverse}
.hr-e{font-size:60px;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.sc-foot{text-align:center;font-size:14px;color:var(--txt-lt);margin-top:5px;font-weight:600}
.xp-row{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.xp-lbl{font-size:13px;font-weight:800;color:var(--gld);white-space:nowrap}
.xp-bar{flex:1;height:8px;background:#EDD5C0;border-radius:4px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gld),#FFD060);border-radius:4px;transition:width .5s ease}
.rftext{font-size:20px;font-weight:800;color:var(--pri);text-align:center;line-height:1.5;margin:12px 0;font-style:italic}
.scrw{font-size:38px;font-weight:900;color:var(--pri);letter-spacing:8px;text-align:center;margin:12px 0;font-family:monospace}
.exp-box{background:var(--gld-lt);border:2px solid var(--gld);border-radius:12px;padding:10px 12px;margin-top:11px}
.exp-box p{font-size:14px;color:var(--txt-md);margin:0;line-height:1.6}
.lvl-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:800;background:var(--gld-lt);color:var(--gld);border:2px solid var(--gld)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:center;justify-content:center;padding:20px}
#ov.show{display:flex}
.ov-box{background:#fff;border-radius:22px;padding:30px 24px;text-align:center;max-width:300px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
</style>
</head>

const ri=n=>Math.floor(Math.random()*n);
const sfl=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=ri(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const pick=(a,n)=>sfl(a).slice(0,n);
const el=id=>document.getElementById(id);

function progHTML(v,t,lbl=""){return`<div class="prog-wrap">${lbl?`<div class="prog-lbl">${lbl}</div>`:""}<div class="prog-bar"><div class="prog-fill" style="width:${t>0?Math.round(v/t*100):0}%"></div></div></div>`;}
function back(){return`<button class="back" onclick="goMenu()">← Menú</button>`;}
function ghdr(ico,ttl,sub=""){return`<div class="ghdr"><div class="ghdr-ico">${ico}</div><div class="ghdr-ttl">${ttl}</div>${sub?`<div class="ghdr-sub">${sub}</div>`:""}</div>`;}
function stars(n,max=5){return'<span class="stars">'+[...Array(max)].map((_,i)=>i<n?"⭐":"☆").join("")+"</span>";}

function shuffleOpts(correct,wrongs){const all=sfl([correct,...wrongs]);return{opts:all,ans:all.indexOf(correct)};}

function genMathProblem(lvl){
  let a,b,q,ans;
  if(lvl===1){a=2+ri(8);b=2+ri(8);if(Math.random()>.5){q=`${a} + ${b}`;ans=a+b;}else{const x=Math.max(a,b),y=Math.min(a,b);q=`${x} − ${y}`;ans=x-y;}}
  else if(lvl===2){a=10+ri(50);b=5+ri(35);if(Math.random()>.5){q=`${a} + ${b}`;ans=a+b;}else{const x=Math.max(a,b),y=Math.min(a,b);q=`${x} − ${y}`;ans=x-y;}}
  else if(lvl===3){const t=ri(3);if(t===0){a=20+ri(70);b=15+ri(50);q=`${a} + ${b}`;ans=a+b;}else if(t===1){a=50+ri(100);b=10+ri(50);q=`${a} − ${b}`;ans=a-b;}else{a=2+ri(9);b=2+ri(9);q=`${a} × ${b}`;ans=a*b;}}
  else if(lvl===4){const t=ri(3);if(t===0){a=100+ri(250);b=50+ri(150);q=`${a} + ${b}`;ans=a+b;}else if(t===1){a=200+ri(300);b=50+ri(180);q=`${a} − ${b}`;ans=a-b;}else{a=5+ri(10);b=5+ri(10);q=`${a} × ${b}`;ans=a*b;}}
  else{const t=ri(4);if(t===0){a=300+ri(500);b=150+ri(350);q=`${a} + ${b}`;ans=a+b;}else if(t===1){a=500+ri(700);b=200+ri(400);q=`${a} − ${b}`;ans=a-b;}else if(t===2){a=7+ri(13);b=7+ri(13);q=`${a} × ${b}`;ans=a*b;}else{b=2+ri(9);ans=2+ri(12);a=b*ans;q=`${a} ÷ ${b}`;}}
  return{q,a:ans};
}
function genMathProblems(lvl,n=6){return Array.from({length:n},()=>genMathProblem(lvl));}

function getWordPool(lvl){let p=[];for(let i=1;i<=lvl;i++)p=[...p,...WORDS_LVL[i]];return sfl(p);}
function getScramPool(lvl){let p=[];for(let i=1;i<=lvl;i++)p=[...p,...SCRAM_LVL[i]];return sfl(p);}
function getTriviaPool(lvl){let p=[];for(let i=1;i<=lvl;i++)p=[...p,...TRIVIA_LVL[i]];return sfl(p);}

let PROF=null;
function loadProfile(){try{const r=localStorage.getItem(STORE);if(r)PROF=JSON.parse(r);}catch(e){PROF=null;}}
function saveProfile(){try{localStorage.setItem(STORE,JSON.stringify(PROF));}catch(e){}}
function createProfile(name){
  const games={};
  GAMELIST.forEach(g=>{games[g.id]={lvl:1,maxLvl:1,xp:0,plays:0};});
  PROF={name:name.trim(),games,totalXp:0,joinDate:new Date().toLocaleDateString('es-ES')};
  saveProfile();
}
function earnXP(gid,score,total,lvl){
  const pct=score/total;
  const xp=Math.round(lvl*10*pct)+(pct>=1?20:pct>=.85?10:0);
  PROF.games[gid].xp+=xp;PROF.games[gid].plays++;PROF.totalXp+=xp;
  let lu=false;
  const gp=PROF.games[gid];
  if(pct>=PASS&&gp.lvl<5&&gp.maxLvl<=gp.lvl){gp.maxLvl=Math.min(5,gp.lvl+1);lu=true;}
  saveProfile();
  return{xp,leveledUp:lu,newMaxLvl:PROF.games[gid].maxLvl};
}
function setGLvl(id,lv){PROF.games[id].lvl=lv;saveProfile();}

function asWords(){
  let t=13;const ws=AS.ws;
  const dist=sfl(["MAR","NUBE","CAFÉ","NOCHE","CAMPO","PÁJARO","VELA","CARTA"].filter(d=>!ws.includes(d))).slice(0,3);
  const opts=sfl([...ws,...dist]);let sel=[];

  }
  function drawRecall(){
    el("asw").innerHTML=`<div class="card"><p style="font-size:17px;font-weight:700;color:var(--txt);margin:0 0 4px">¿Cuáles palabras recuerda?</p><p style="font-size:13px;color:var(--txt-md);margin:0 0 12px">Toque las que memorizó:</p><div class="cgrid">${opts.map((w,i)=>`<button id="rw${i}" class="cbtn" onclick="tgW(${i},'${w}')">${w}</button>`).join("")}</div><button class="btn bp" style="margin-top:10px" onclick="subW()">Listo ✓</button></div>`;

function asMath(){

}

// GAME: PAIRS (cols vary = anti-pattern)
// ============================================================
let PG={};
SCREENS.pairs=()=>{
  const lvl=PROF.games.pairs.lvl;const n=[6,8,10,12,16][lvl-1];
  const cols=n<=6?3:n<=10?[3,4][ri(2)]:4;
  const emjs=pick(EMOJIS,n/2);
  PG={cards:sfl([...emjs,...emjs].map((e,i)=>({id:i,e,flip:false,done:false}))),open:[],lock:false,moves:0,done:false,cols,total:n/2};
  drawPairs();
};
function drawPairs(){
  const {cards,moves,done,cols,total}=PG;const matched=cards.filter(c=>c.done).length/2;
  if(done){showDone("pairs",matched,total,()=>nav("pairs"));return;}
  pg().innerHTML=`${back()}${ghdr("🃏","Memoria de Parejas",`Nivel ${PROF.games.pairs.lvl}`)}
  <div class="brow"><span class="badge bdg-g">✓ ${matched}/${total} parejas</span><span class="badge bdg-d">🎯 ${moves} intentos</span></div>
  ${progHTML(matched,total)}
  <div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:8px">
    ${cards.map(c=>`<div class="pcard ${c.done?"done":c.flip?"flip":""}" onclick="flipC(${c.id})" style="font-size:0">${c.flip||c.done?`<span style="font-size:${cols<=3?34:28}px">${c.e}</span>`:`<span style="font-size:20px;color:rgba(255,255,255,.7)">?</span>`}</div>`).join("")}
  </div>`;
}
window.flipC=id=>{
  const P=PG;if(P.lock)return;
  const c=P.cards.find(x=>x.id===id);if(!c||c.flip||c.done)return;
  c.flip=true;P.open.push(id);
  if(P.open.length===2){
    P.moves++;P.lock=true;
    const [a,b]=P.open.map(oid=>P.cards.find(x=>x.id===oid));
    if(a.e===b.e){P.cards.forEach(x=>{if(P.open.includes(x.id))x.done=true;});P.open=[];setTimeout(()=>{P.lock=false;if(P.cards.every(x=>x.done))P.done=true;drawPairs();},350);}
    else{setTimeout(()=>{P.cards.forEach(x=>{if(P.open.includes(x.id))x.flip=false;});P.open=[];P.lock=false;drawPairs();},950);}
    P.open=[];
  }
  drawPairs();
};

let SQ={};let sqT=null;
SCREENS.seq=()=>{const lvl=PROF.games.seq.lvl;SQ={seq:[],user:[],phase:"idle",round:0,rec:0,lit:null,lvl,colors:sfl(SEQ_BASE)};drawSeq();setTimeout(startSQ,600);};
function startSQ(prev=[]){
  clearTimeout(sqT);const next=[...prev,ri(4)];SQ.seq=next;SQ.user=[];SQ.phase="showing";drawSeq();
  let i=0;const spd=SQ.lvl>=4?480:600;
  function go(){if(i>0){SQ.lit=null;drawSeq();}if(i>=next.length){SQ.phase="input";SQ.lit=null;drawSeq();return;}sqT=setTimeout(()=>{SQ.lit=next[i];drawSeq();i++;sqT=setTimeout(go,spd);},380);}
  sqT=setTimeout(go,600);
}
function drawSeq(){
  const {phase,round,rec,lit,seq,user,lvl,colors}=SQ;
  const msgs={idle:"Preparando...",showing:"🔍 Observe bien...",input:`👆 Repita (${user.length}/${seq.length})`,right:"✅ ¡Excelente!",wrong:""};
  pg().innerHTML=`${back()}${ghdr("🌈","Secuencia de Colores",`Nivel ${lvl}`)}
  <div class="brow"><span class="badge bdg-gd">🏆 Récord: ${rec}</span><span class="badge">Ronda ${round+1}</span></div>
  <div class="card" style="text-align:center;min-height:74px">${phase==="wrong"?`<div style="font-size:21px;font-weight:800;color:var(--err);margin-bottom:6px">❌ ¡Incorrecto!</div><div style="font-size:14px;color:var(--txt-md);margin-bottom:12px">Llegó a ronda ${round+1} &nbsp;•&nbsp; Récord: ${rec}</div><button class="btn bp" style="margin:0" onclick="restSQ()">De nuevo 🔄</button><button class="btn bg" style="margin-top:6px" onclick="goMenu()">Menú</button>`:`<div style="font-size:18px;font-weight:700;color:${phase==="right"?"var(--ok)":phase==="input"?"var(--grn)":"var(--pri)"};padding:14px 0">${msgs[phase]}</div>`}</div>
  <div class="sqgrid">${colors.map((c,i)=>`<button class="sqbtn ${lit===i?"lit":""}" style="background:${lit===i?c.lit:c.bg}" onclick="presSQ(${i})" ${phase!=="input"?"disabled":""}>${c.n}</button>`).join("")}</div>`;
}
window.presSQ=i=>{if(SQ.phase!=="input")return;SQ.lit=i;drawSeq();setTimeout(()=>{SQ.lit=null;drawSeq();},180);const nu=[...SQ.user,i];if(nu[nu.length-1]!==SQ.seq[nu.length-1]){SQ.phase="wrong";if(SQ.round>SQ.rec)SQ.rec=SQ.round;drawSeq();return;}SQ.user=nu;if(nu.length===SQ.seq.length){SQ.round++;if(SQ.round>SQ.rec)SQ.rec=SQ.round;SQ.phase="right";drawSeq();setTimeout(()=>startSQ(SQ.seq),800);}};
window.restSQ=()=>{SQ.seq=[];SQ.user=[];SQ.phase="idle";SQ.round=0;SQ.colors=sfl(SEQ_BASE);drawSeq();setTimeout(startSQ,500);};

window.chkTV=i=>{if(TG.ans)return;TG.chosen=i;TG.ans=true;if(i===TG.items[TG.idx].ans)TG.score++;drawTrivia();};
window.nextTV=()=>{TG.idx++;TG.ans=false;TG.chosen=-1;if(TG.idx>=TG.items.length)TG.done=true;drawTrivia();};

// ============================================================
// INIT
// ============================================================
loadProfile();
if(!PROF||!PROF.name)nav("profile");
else nav("welcome");
</script>
